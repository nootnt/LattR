[package]
name = "lattr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
egui = "0.37"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["raw-api"] }
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
candle-core = "=0.9.2"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
# build with --no-default-features for CPU only
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[profile.release]
lto = "thin"
